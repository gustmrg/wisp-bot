<!doctype html>
<!--
  Colors live in style attributes: the policy allows those, but no inline
  <style> or script, and this page must look right before any file loads.
-->
<html
  lang="en"
  data-wisp-platform="web"
  style="background: #ffffff; background: light-dark(#ffffff, #0a0a0a); color: #202020; color: light-dark(#202020, #ededed)"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wisp" />
  <meta http-equiv="Content-Security-Policy" content="__WISP_CSP__" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Wisp</title>
</head>
<body>
  <!--
    The splash, shown until the app starts and replaces it with the same
    layout. The message appears if opening is slow or fails; its link works
    even if the app never loads.
  -->
  <div id="root">
    <div
      id="boot"
      role="status"
      aria-label="Opening Wisp"
      style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center"
    >
      <img src="/apple-touch-icon.png" alt="" width="64" height="64" draggable="false" />
      <div
        id="boot-notice"
        hidden
        style="position: absolute; top: calc(50% + 56px); left: 16px; right: 16px; flex-direction: column; align-items: center; gap: 8px; font: 14px/1.4 system-ui, -apple-system, sans-serif; text-align: center"
      >
        <p id="boot-message" style="margin: 0; opacity: 0.6">Taking longer than usual…</p>
        <a href="/" style="color: inherit; font-size: 13px">Reload</a>
      </div>
    </div>
  </div>
  <script type="module" src="../src/web-main.tsx"></script>
</body>
</html>
