<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="__WISP_CSP__" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Wisp Bot</title>
</head>
<body>
  <!-- The splash, shown until the app starts and replaces it with the same layout. -->
  <div id="root">
    <div
      role="status"
      aria-label="Opening Wisp"
      style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center"
    >
      <img src="/favicon.svg" alt="" width="64" height="64" draggable="false" />
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
