name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (patch, minor, major, beta, or an exact version such as 1.2.3 or 1.3.0-beta.1). Betas run from any branch; other releases only from main.
        required: true
        type: string
        default: patch

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Resolves the next version on top of the chosen branch and runs every
  # quality gate against the bumped tree. Nothing is committed or tagged until
  # packaging succeeds, so a failed run leaves the repository untouched.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - id: bump
        name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REQUESTED_VERSION" == beta ]]; then
            # The next minor version's next beta: 0.18.0 leads to 0.19.0-beta.1,
            # then 0.19.0-beta.2, so every beta sorts above the latest release.
            BASE="$(node -p "const [major, minor] = require('./package.json').version.split('-')[0].split('.').map(Number); [major, minor + 1, 0].join('.')")"
            LAST="$(git ls-remote --tags origin | sed -nE "s#^.*refs/tags/v${BASE//./\\.}-beta\.([0-9]+)\$#\1#p" | sort -n | tail -n 1)"
            REQUESTED_VERSION="$BASE-beta.$(( ${LAST:-0} + 1 ))"
          fi
          npm version "$REQUESTED_VERSION" --no-git-tag-version --allow-same-version
          VERSION="$(node -p "require('./package.json').version")"
          # The app follows the beta channel only for versions named -beta.N.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::$VERSION is neither a release (1.2.3) nor a beta (1.3.0-beta.1)."
            exit 1
          fi
          if [[ "$VERSION" != *-* && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Only betas are released from $GITHUB_REF_NAME. Release $VERSION from main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_REF_NAME at $GITHUB_SHA."
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > wisp-bot-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: wisp-bot-sbom.cdx.json
          retention-days: 30

  package:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: macos
            builder-args: --mac dmg zip --arm64
          - os: ubuntu-latest
            name: linux
            builder-args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder ${{ matrix.builder-args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # Commits the version bump, tags it, and publishes the release only after
  # every gate and both packaging jobs have passed. A release moves main with
  # it; a beta's commit is kept by its tag alone, so no branch takes its version.
  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Commit and tag the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): prepare v$VERSION"
          fi
          git tag "v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            git push origin "refs/tags/v$VERSION"
          else
            # Atomic, so main and the tag move together or not at all. A push to
            # main during the run makes this fail rather than overwrite it.
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: node scripts/checksums.mjs artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          # Prerelease versions (1.2.0-beta.1) feed only the beta update channel
          # and must not become the latest release.
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Wisp Bot $TAG" --generate-notes "${FLAGS[@]}"
          gh release upload "$TAG" --clobber artifacts/*

  # Publishes the headless server to npm at the version just tagged. The
  # desktop app installs exactly its own version on a remote machine, and
  # `npx @gustmrg/wisp-server setup` runs this package, so every release needs it.
  # Re-run this job alone if it fails; npm refuses a version published twice.
  # It authenticates with the package's npm trusted publisher (OIDC).
  publish-server:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          # Leave token auth unconfigured so npm can use OIDC.
      - run: npm ci
      - run: npm run package:server
      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships npm 10.
      - run: npm install --global npm@^11.5.1
      - name: Publish to npm
        working-directory: release/server
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # A prerelease must not become what `npx @gustmrg/wisp-server` runs.
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=beta; fi
          # A re-run after a publish that went through only waits for it below.
          if [[ "$(npm view "@gustmrg/wisp-server@$VERSION" version --prefer-online 2>/dev/null)" == "$VERSION" ]]; then
            echo "@gustmrg/wisp-server $VERSION is already on npm."
            exit 0
          fi
          if ! npm publish --provenance --access public --tag "$TAG"; then
            echo "::error::@gustmrg/wisp-server $VERSION was not published. Check the package's trusted publisher on npm, then re-run this job."
            exit 1
          fi
      # npm takes a few minutes to process a new version. Until then the app
      # cannot install it on a server, so the release is not done yet.
      - name: Wait until npm serves the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=beta; fi
          deadline=$((SECONDS + 600))
          while true; do
            found="$(npm view "@gustmrg/wisp-server@$VERSION" version --prefer-online 2>/dev/null || true)"
            tagged="$(npm view @gustmrg/wisp-server "dist-tags.$TAG" --prefer-online 2>/dev/null || true)"
            if [[ "$found" == "$VERSION" && "$tagged" == "$VERSION" ]]; then
              echo "@gustmrg/wisp-server $VERSION is installable, and $TAG points to it."
              exit 0
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::npm still does not serve @gustmrg/wisp-server $VERSION as $TAG after 10 minutes (version: ${found:-none}, $TAG: ${tagged:-none}). Check the package on npmjs.com, then re-run this job."
              exit 1
            fi
            echo "Waiting for npm (version: ${found:-none}, $TAG: ${tagged:-none})…"
            sleep 15
          done
