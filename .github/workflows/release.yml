name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (patch, minor, major, beta, or an exact version such as 1.2.3 or 1.3.0-beta.1). Releases and betas run from main.
        required: true
        type: string
        default: patch
      preview_branch:
        description: Allow a beta from a branch other than main, to preview that branch on its own.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Resolves the next version on top of the chosen branch. The quality gates
  # and packaging both start from it and run in parallel. Nothing is committed
  # or tagged until both succeed, so a failed run leaves the repository untouched.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - id: bump
        name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          TAGS="$(git ls-remote --tags origin)"
          if [[ "$REQUESTED_VERSION" == beta ]]; then
            REQUESTED_VERSION="$(node scripts/release-version.mjs next-beta "$(node -p "require('./package.json').version")" <<<"$TAGS")"
          fi
          npm version "$REQUESTED_VERSION" --no-git-tag-version --allow-same-version
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Only betas are released from $GITHUB_REF_NAME. Release $VERSION from main."
              exit 1
            fi
            # A beta from main carries every fix merged so far; one from a
            # branch carries only that branch.
            if [[ "$PREVIEW_BRANCH" != true ]]; then
              echo "::error::Betas run from main. To preview $GITHUB_REF_NAME on its own, run again with preview_branch checked."
              exit 1
            fi
          fi
          # Fails unless every install can update to the version, and names
          # the tag the release notes start from.
          PREVIOUS="$(node scripts/release-version.mjs check "$VERSION" <<<"$TAGS")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_REF_NAME at $GITHUB_SHA, with notes since ${PREVIOUS:-the first commit}."

  # Runs every quality gate against the bumped tree.
  verify:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > wisp-bot-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: wisp-bot-sbom.cdx.json
          retention-days: 30

  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: macos
            builder-args: --mac dmg zip --arm64
          - os: ubuntu-latest
            name: linux
            builder-args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Betas wear the amber dev icon so they are told apart from the stable
          # app once installed. electron-builder converts the PNG for each platform.
          ICON_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            ICON_ARGS=(-c.mac.icon=build/icon-mac-dev.png -c.linux.icon=build/icon-mac-dev.png)
          fi
          npm run build && npx electron-builder ${{ matrix.builder-args }} "${ICON_ARGS[@]}" --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # Commits the version bump, tags it, and uploads the release as a draft only
  # after every gate and both packaging jobs have passed. A release moves main
  # with it; a beta's commit is kept by its tag alone, so no branch takes its
  # version. The draft stays hidden from the updater until the server is on npm.
  release:
    needs: [version, verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main only takes pull requests. This deploy key is the ruleset's one
      # bypass actor, so the version commit can still reach main.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Commit and tag the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): prepare v$VERSION"
          fi
          git tag "v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            git push origin "refs/tags/v$VERSION"
          else
            # Atomic, so main and the tag move together or not at all. A push to
            # main during the run makes this fail rather than overwrite it.
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: node scripts/checksums.mjs artifacts
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          # Prerelease versions (1.2.0-beta.1) feed only the beta update channel
          # and must not become the latest release.
          FLAGS=(--draft --generate-notes)
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if [[ -n "$PREVIOUS" ]]; then FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --verify-tag --title "Wisp Bot $TAG" "${FLAGS[@]}"
          gh release upload "$TAG" --clobber artifacts/*

  # Publishes the headless server to npm at the version just tagged. The
  # desktop app installs exactly its own version on a remote machine, and
  # `npx @gustmrg/wisp-server setup` runs this package, so every release needs it.
  # Re-run this job if it fails; npm refuses a version published twice, and the
  # release stays a draft until it passes.
  # It authenticates with the package's npm trusted publisher (OIDC).
  publish-server:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          # Leave token auth unconfigured so npm can use OIDC.
      - run: npm ci
      - run: npm run package:server
      # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships npm 10.
      - run: npm install --global npm@^11.5.1
      - name: Publish to npm
        working-directory: release/server
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A prerelease must not become what `npx @gustmrg/wisp-server` runs.
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=beta; fi
          # A re-run after a publish that went through only waits for it below.
          if [[ "$(npm view "@gustmrg/wisp-server@$VERSION" version --prefer-online 2>/dev/null)" == "$VERSION" ]]; then
            echo "@gustmrg/wisp-server $VERSION is already on npm."
            exit 0
          fi
          if ! npm publish --provenance --access public --tag "$TAG"; then
            echo "::error::@gustmrg/wisp-server $VERSION was not published. Check the package's trusted publisher on npm, then re-run this job."
            exit 1
          fi
      # npm takes a few minutes to process a new version. Until then the app
      # cannot install it on a server, so the release is not done yet.
      - name: Wait until npm serves the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=beta; fi
          deadline=$((SECONDS + 600))
          while true; do
            found="$(npm view "@gustmrg/wisp-server@$VERSION" version --prefer-online 2>/dev/null || true)"
            tagged="$(npm view @gustmrg/wisp-server "dist-tags.$TAG" --prefer-online 2>/dev/null || true)"
            if [[ "$found" == "$VERSION" && "$tagged" == "$VERSION" ]]; then
              echo "@gustmrg/wisp-server $VERSION is installable, and $TAG points to it."
              exit 0
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::npm still does not serve @gustmrg/wisp-server $VERSION as $TAG after 10 minutes (version: ${found:-none}, $TAG: ${tagged:-none}). Check the package on npmjs.com, then re-run this job."
              exit 1
            fi
            echo "Waiting for npm (version: ${found:-none}, $TAG: ${tagged:-none})…"
            sleep 15
          done

  # Publishes the draft once npm serves the matching server, so no updated app
  # meets a version it cannot install on a server.
  publish-release:
    needs: [version, publish-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          FLAGS=(--draft=false)
          if [[ "$TAG" != *-* ]]; then FLAGS+=(--latest); fi
          gh release edit "$TAG" "${FLAGS[@]}"
