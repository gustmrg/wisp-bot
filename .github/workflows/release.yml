name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish_draft:
        description: Upload verified artifacts to a draft GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: node scripts/verify-release.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > wisp-bot-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: wisp-bot-sbom.cdx.json
          retention-days: 30

  package:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Build and package macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder --mac dmg zip --x64 --arm64 --publish never
      - name: Generate checksums
        run: node scripts/checksums.mjs release
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  draft:
    if: inputs.publish_draft
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-release.mjs
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Wisp Bot $GITHUB_REF_NAME"
          find artifacts -type f -exec gh release upload "$GITHUB_REF_NAME" {} +
