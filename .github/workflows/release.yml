name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (patch, minor, major, beta, or an exact version such as 1.2.3 or 1.3.0-beta.1). Releases and betas run from main.
        required: true
        type: string
        default: patch
      preview_branch:
        description: Allow a beta from a branch other than main, to preview that branch on its own.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Resolves the next version on top of the chosen branch. The quality gates
  # and packaging both start from it and run in parallel. Nothing is committed
  # or tagged until both succeed, so a failed run leaves the repository untouched.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: bump
        name: Resolve release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        run: |
          TAGS="$(git ls-remote --tags origin)"
          if [[ "$REQUESTED_VERSION" == beta ]]; then
            REQUESTED_VERSION="$(node scripts/release-version.mjs next-beta "$(node -p "require('./package.json').version")" <<<"$TAGS")"
          fi
          npm version "$REQUESTED_VERSION" --no-git-tag-version --allow-same-version
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Only betas are released from $GITHUB_REF_NAME. Release $VERSION from main."
              exit 1
            fi
            # A beta from main carries every fix merged so far; one from a
            # branch carries only that branch.
            if [[ "$PREVIEW_BRANCH" != true ]]; then
              echo "::error::Betas run from main. To preview $GITHUB_REF_NAME on its own, run again with preview_branch checked."
              exit 1
            fi
          fi
          # Fails unless every install can update to the version, and names
          # the tag the release notes start from.
          PREVIOUS="$(node scripts/release-version.mjs check "$VERSION" <<<"$TAGS")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $GITHUB_REF_NAME at $GITHUB_SHA, with notes since ${PREVIOUS:-the first commit}."

  # Runs every quality gate against the bumped tree.
  verify:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > wisp-bot-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: wisp-bot-sbom.cdx.json
          retention-days: 30

  package:
    # The app carries the hashes of the server archives it installs.
    needs: [version, server-archive]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            name: macos
            builder-args: --mac dmg zip --arm64
          - os: ubuntu-latest
            name: linux
            builder-args: --linux AppImage deb --x64
          - os: windows-latest
            name: windows
            builder-args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; the packaging script is bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - uses: actions/download-artifact@v8
        with:
          pattern: server-hash-*
          path: server-archives
          merge-multiple: true
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Betas wear the amber dev icon so they are told apart from the stable
          # app once installed. electron-builder converts the PNG for each platform.
          ICON_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            ICON_ARGS=(-c.mac.icon=build/icon-mac-dev.png -c.linux.icon=build/icon-mac-dev.png -c.win.icon=build/icon-mac-dev.png)
          fi
          npm run build:desktop
          node scripts/server-archive-hashes.mjs server-archives dist-electron/server-archives.json
          npx electron-builder ${{ matrix.builder-args }} "${ICON_ARGS[@]}" --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
            release/beta*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  # Builds the server archives, which bring their own Node.js, on a runner of
  # each processor, and checks each one on clean distributions without Node.js:
  # the oldest supported glibc (2.28, Debian 10) up to the current releases.
  server-archive:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@v6
        with:
          path: release/.node-cache
          key: node-dist-${{ matrix.arch }}-${{ hashFiles('.node-version') }}
      - run: npm ci
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      # Choosing the C library of optional dependencies (--libc) needs npm 11.
      - run: npm install --global npm@^11.5.1
      - run: npm run package:server
      - run: node scripts/package-server-archive.mjs --arch ${{ matrix.arch }}
      - name: Check the archive without Node.js
        env:
          ARCHIVE: release/wisp-server-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
        run: |
          images=(debian:buster-slim debian:bookworm-slim ubuntu:22.04 ubuntu:24.04)
          logs_dir="$(mktemp -d)"
          pids=()
          for i in "${!images[@]}"; do
            image="${images[$i]}"
            docker run --rm -v "$PWD/release:/release:ro" -v "$PWD/scripts:/scripts:ro" "$image" \
              sh /scripts/smoke-server-archive.sh "/$ARCHIVE" >"$logs_dir/$i.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!images[@]}"; do
            image="${images[$i]}"
            status=0
            wait "${pids[$i]}" || status=$?
            echo "::group::$image"
            cat "$logs_dir/$i.log"
            echo "::endgroup::"
            if ((status != 0)); then
              echo "::error::$image smoke check failed (exit $status)."
              failed=1
            fi
          done
          rm -rf "$logs_dir"
          exit "$failed"
      - uses: actions/upload-artifact@v7
        with:
          name: server-linux-${{ matrix.arch }}
          path: release/wisp-server-*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: server-hash-${{ matrix.arch }}
          path: release/wisp-server-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  # Commits the version bump, tags it, and publishes the GitHub release only
  # after every gate and every packaging job has passed. A release moves main
  # with it; a beta's commit is kept by its tag alone, so no branch takes its
  # version. The release stays a draft while its assets upload so installs never
  # see a partial release; server archives go up with it, so they are public as
  # soon as the app is. Pushing the tag triggers publish-server.yml separately.
  release:
    needs: [version, verify, package, server-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main only takes pull requests. This deploy key is the ruleset's one
      # bypass actor, so the version commit can still reach main.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Commit and tag the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): prepare v$VERSION"
          fi
          git tag "v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            git push origin "refs/tags/v$VERSION"
          else
            # Atomic, so main and the tag move together or not at all. A push to
            # main during the run makes this fail rather than overwrite it.
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          # server-hash-* is only for desktop packaging; SHA256SUMS.txt covers every release asset.
          rm -f artifacts/*.sha256
          node scripts/checksums.mjs artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          # Prerelease versions (1.2.0-beta.1) feed only the beta update channel
          # and must not become the latest release.
          CREATE_FLAGS=(--draft --generate-notes)
          PUBLISH_FLAGS=(--draft=false)
          if [[ "$TAG" == *-* ]]; then
            CREATE_FLAGS+=(--prerelease)
          else
            PUBLISH_FLAGS+=(--latest)
          fi
          if [[ -n "$PREVIOUS" ]]; then CREATE_FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --verify-tag --title "Wisp Bot $TAG" "${CREATE_FLAGS[@]}"
          gh release upload "$TAG" --clobber artifacts/*
          gh release edit "$TAG" "${PUBLISH_FLAGS[@]}"
