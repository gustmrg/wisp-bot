<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wisp — connection flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Page chrome (the explorer around the mock), not part of the design. */
  :root {
    --page-bg: #e9e9ea;
    --page-panel: #ffffff;
    --page-line: rgba(0, 0, 0, 0.1);
    --page-text: #202020;
    --page-muted: #6b6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #050505;
      --page-panel: #151515;
      --page-line: rgba(255, 255, 255, 0.1);
      --page-text: #ededed;
      --page-muted: #9a9a9a;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #050505;
    --page-panel: #151515;
    --page-line: rgba(255, 255, 255, 0.1);
    --page-text: #ededed;
    --page-muted: #9a9a9a;
  }

  /* App tokens, copied from styles.css (light, then .dark). */
  .app {
    color-scheme: light;
    --background: #ffffff;
    --foreground: #202020;
    --card: #ffffff;
    --popover: #f4f4f4;
    --primary: #202020;
    --primary-foreground: #fafafa;
    --muted: #eeeeee;
    --accent: #e4e4e4;
    --destructive: #cc343b;
    --border: rgba(0, 0, 0, 0.08);
    --input: rgba(0, 0, 0, 0.1);
    --ring: #666666;
    --sidebar-background: #f5f5f5;
    --text-dim: #656565;
    --text-faint: #727272;
    --blue: #126fd6;
    --green: #16844e;
    --warning: #855c17;
    --warning-solid: #f59e0b;
    --radius: 10px;
  }
  .app.dark {
    color-scheme: dark;
    --background: #0a0a0a;
    --foreground: #ededed;
    --card: #1d1d1d;
    --popover: #202020;
    --primary: #eeeeee;
    --primary-foreground: #151515;
    --muted: #252525;
    --accent: #303030;
    --destructive: #e5484d;
    --border: rgba(255, 255, 255, 0.08);
    --input: rgba(255, 255, 255, 0.1);
    --ring: #777777;
    --sidebar-background: #151514;
    --text-dim: #9a9a9a;
    --text-faint: #6f6f6f;
    --blue: #4a9eff;
    --green: #32d583;
    --warning: #e6b765;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--page-text);
    font: 14px/1.5 "Geist", ui-sans-serif, system-ui, sans-serif;
  }
  code, .mono { font-family: "Geist Mono", ui-monospace, monospace; }

  /* ---------- explorer chrome ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--page-bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--page-line);
  }
  .top h1 { margin: 0 8px 0 0; font-size: 15px; font-weight: 600; }
  .top h1 small { font-weight: 400; color: var(--page-muted); margin-left: 6px; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl > span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); }
  .seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border-radius: 9px; background: var(--page-panel); border: 1px solid var(--page-line); }
  .seg button {
    border: 0; background: transparent; color: var(--page-muted);
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--page-text); color: var(--page-bg); }
  .seg button:focus-visible { outline: 2px solid var(--page-muted); outline-offset: 1px; }

  .stage {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px;
    max-width: 1340px; margin: 0 auto; padding: 24px;
  }
  .variants { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .variants > span { font-size: 12px; color: var(--page-muted); }
  .notes { background: var(--page-panel); border: 1px solid var(--page-line); border-radius: 14px; padding: 16px 18px; align-self: start; position: sticky; top: 76px; }
  .notes h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .notes ul { margin: 0; padding-left: 18px; color: var(--page-muted); font-size: 13px; }
  .notes li + li { margin-top: 6px; }
  .notes li b { color: var(--page-text); font-weight: 500; }
  .notes hr { border: 0; border-top: 1px solid var(--page-line); margin: 14px 0; }

  .frame-wrap { display: flex; justify-content: center; }
  .frame {
    width: 100%; height: 680px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--page-line);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.35);
    transition: width .2s;
  }
  .frame.mobile { width: 390px; height: 780px; border-radius: 36px; border-width: 8px; border-color: #111; }

  /* ---------- the app ---------- */
  .app {
    height: 100%; display: flex; flex-direction: column;
    background: var(--background); color: var(--foreground);
    font-size: 14px; position: relative;
  }
  .titlebar { flex: none; height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--sidebar-background); }
  .titlebar i { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); display: block; }
  .frame.mobile .titlebar { display: none; }
  .screen { flex: 1; min-height: 0; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
  .frame.mobile .screen { padding: 12px; }

  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px;
    font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground);
  }
  .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--input); }
  .btn.ghost { background: transparent; color: var(--foreground); }
  .btn.ghost:hover, .btn.outline:hover { background: var(--muted); }
  .btn.xs { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
  .btn svg.i { width: 14px; height: 14px; }
  .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  /* The one card every blocking state uses. */
  .conn { width: 100%; max-width: 520px; margin: auto 0; }
  .card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .card-body { padding: 22px 24px 20px; }
  .frame.mobile .card-body { padding: 18px 16px 16px; }
  .bar { position: absolute; inset: 0 0 auto 0; height: 2px; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--tone); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

  .server {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; margin-bottom: 18px;
    border-radius: 10px; background: var(--muted);
    font-size: 13px; min-width: 0;
  }
  .server .ico { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--card); color: var(--text-dim); flex: none; }
  .server .who { min-width: 0; flex: 1; }
  .server .name { font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .server .addr { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 99px; border: 1px solid var(--input); color: var(--text-dim); line-height: 18px; }
  .switch { margin-left: auto; }

  .head { display: flex; gap: 14px; align-items: flex-start; }
  .badge { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent); }
  .badge svg.i { width: 20px; height: 20px; }
  .head h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
  .head p { margin: 4px 0 0; color: var(--text-dim); line-height: 1.5; }
  .frame.mobile .head h2 { font-size: 16px; }

  .tone-neutral { --tone: var(--text-dim); }
  .tone-info { --tone: var(--blue); }
  .tone-warn { --tone: var(--warning-solid); }
  .tone-error { --tone: var(--destructive); }
  .tone-ok { --tone: var(--green); }

  ol.steps { list-style: none; margin: 18px 0 0; padding: 0; position: relative; }
  ol.steps li { position: relative; display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; padding: 6px 0; align-items: start; }
  ol.steps li:not(:last-child)::before { content: ""; position: absolute; left: 9.5px; top: 26px; bottom: -6px; width: 1px; background: var(--border); }
  ol.steps li.done:not(:last-child)::before { background: color-mix(in srgb, var(--green) 45%, transparent); }
  .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--card); position: relative; z-index: 1; }
  .dot svg.i { width: 14px; height: 14px; }
  li.failed .dot svg.i { width: 16px; height: 16px; }
  li.pending .dot { color: var(--text-faint); }
  li.pending .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
  li.done .dot { color: var(--green); }
  li.active .dot { color: var(--tone); }
  li.failed .dot { color: var(--destructive); }
  li.skipped .dot { color: var(--text-faint); }
  .step-label { line-height: 20px; }
  li.pending .step-label, li.skipped .step-label { color: var(--text-dim); }
  li.skipped .step-label { text-decoration: line-through; }
  li.active .step-label, li.failed .step-label { font-weight: 500; }
  .step-sub { display: block; font-size: 12px; color: var(--text-dim); margin-top: 1px; line-height: 1.45; }
  li.failed .step-sub { color: var(--destructive); }
  .step-meta { font-size: 12px; color: var(--text-faint); line-height: 20px; font-variant-numeric: tabular-nums; }

  .box { margin-top: 16px; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; border: 1px solid var(--border); background: var(--popover); }
  .box.warn { border-color: color-mix(in srgb, var(--warning-solid) 35%, transparent); background: color-mix(in srgb, var(--warning-solid) 9%, var(--card)); }
  .box.error { border-color: color-mix(in srgb, var(--destructive) 30%, transparent); background: color-mix(in srgb, var(--destructive) 6%, var(--card)); }
  .box h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .box ol, .box ul { margin: 0; padding-left: 18px; }
  .box li + li { margin-top: 4px; }
  .box p { margin: 0; }
  .cmd { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; padding: 6px 6px 6px 10px; border-radius: 7px; background: var(--card); border: 1px solid var(--border); font-size: 12px; }
  .cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  details.log { margin-top: 12px; font-size: 13px; }
  details.log summary { cursor: pointer; color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; list-style: none; }
  details.log summary::-webkit-details-marker { display: none; }
  details.log summary svg.i { width: 14px; height: 14px; transition: transform .15s; }
  details.log[open] summary svg.i { transform: rotate(90deg); }
  details.log pre { margin: 8px 0 0; max-height: 150px; overflow: auto; padding: 10px 12px; border-radius: 8px; background: var(--muted); font: 11.5px/1.6 "Geist Mono", monospace; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; align-items: center; }
  .actions .spacer { flex: 1; }
  .frame.mobile .actions { flex-direction: column; align-items: stretch; }
  .frame.mobile .actions .spacer { display: none; }
  .frame.mobile .actions .btn { height: 38px; }

  .manage { border-top: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); background: color-mix(in srgb, var(--muted) 40%, var(--card)); }
  .frame.mobile .manage { padding: 10px 16px; }
  .manage .btn { margin-left: auto; }
  .panel-placeholder { margin: 24px; border: 1px dashed var(--input); border-radius: 14px; padding: 16px; font-size: 12px; color: var(--text-faint); text-align: center; }

  /* ---------- app shell for the non-blocking states ---------- */
  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .shell-main { flex: 1; min-height: 0; display: flex; }
  .side { width: 220px; flex: none; background: var(--sidebar-background); border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .frame.mobile .side { display: none; }
  .side .w { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .side .w.on { background: var(--accent); }
  .side .w span.av { width: 18px; height: 18px; border-radius: 50%; background: var(--muted); border: 1px solid var(--input); }
  .side .conn-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; font-size: 12px; color: var(--text-dim); }
  .side .conn-foot .led { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 22%, transparent); }
  .chat { flex: 1; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .chat.dimmed { opacity: .55; }
  .bubble { max-width: 70%; padding: 8px 12px; border-radius: 14px; background: var(--muted); font-size: 13px; }
  .bubble.out { align-self: flex-end; background: var(--blue); color: #fff; }
  .composer { margin-top: auto; height: 42px; border-radius: 12px; border: 1px solid var(--input); display: flex; align-items: center; padding: 0 12px; color: var(--text-faint); font-size: 13px; }

  .banner {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    padding: 7px 14px; font-size: 13px;
    background: color-mix(in srgb, var(--tone) 13%, var(--background));
    border-bottom: 1px solid color-mix(in srgb, var(--tone) 25%, transparent);
  }
  .banner .b-ico { display: flex; color: var(--tone); }
  .banner .b-title { font-weight: 500; }
  .banner .b-meta { color: var(--text-dim); }
  .banner .b-meta::before { content: "· "; }
  .banner .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .frame.mobile .banner { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 2px 8px; padding: 8px 12px; }
  .frame.mobile .banner .b-ico { grid-row: 1 / span 2; align-self: center; }
  .frame.mobile .banner .b-title, .frame.mobile .banner .b-meta, .frame.mobile .banner .acts { grid-column: 2; }
  .frame.mobile .banner .b-meta { font-size: 12px; }
  .frame.mobile .banner .b-meta::before { content: none; }
  .frame.mobile .banner .acts { margin: 4px 0 0; }

  .pop { position: absolute; right: 14px; top: 84px; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.35); padding: 14px 16px; font-size: 13px; z-index: 3; }
  .frame.mobile .pop { left: 0; right: 0; top: auto; bottom: 0; width: auto; border-radius: 18px 18px 0 0; padding: 16px 16px 28px; }
  .pop h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .pop p { margin: 4px 0 0; color: var(--text-dim); }
  .pop ol.steps { margin-top: 10px; }

  .toast { position: absolute; right: 16px; bottom: 16px; z-index: 4; width: 320px; max-width: calc(100% - 32px); display: flex; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); font-size: 13px; }
  .toast > svg.i { color: var(--green); margin-top: 2px; }
  .toast .t-text { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .toast strong { font-size: 14px; font-weight: 600; }
  .toast span { font-size: 12px; color: var(--text-dim); }
  .toast .btn { margin: -4px -4px 0 auto; width: 24px; padding: 0; }

  @media (max-width: 1000px) {
    .stage { grid-template-columns: 1fr; padding: 16px; }
    .notes { position: static; }
    .frame.mobile { width: min(390px, 100%); }
  }
  @media (max-width: 620px) { .top { padding: 10px 16px; } }
</style>
</head>
<body>
<div class="top">
  <h1>Connection flow <small>SWE-134 · mock</small></h1>
  <div class="ctl"><span>State</span><div class="seg" id="states"></div></div>
  <div class="ctl"><span>Theme</span><div class="seg" id="theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="ctl"><span>Viewport</span><div class="seg" id="vp"><button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="mobile">Mobile</button></div></div>
</div>

<div class="stage">
  <div>
    <div class="variants"><span>Variant</span><div class="seg" id="variants"></div></div>
    <div class="frame-wrap"><div class="frame" id="frame"><div class="app" id="app"></div></div></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
const ICONS = {
  server: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  checkCircle: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  xCircle: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  laptop: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
  key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
  wifiOff: '<path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/>',
  arrowUp: '<circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 16V8"/>',
  ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  minus: '<path d="M5 12h14"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
};
const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

const SERVER = { name: "raspberrypi", kind: "SSH", addr: "pi@raspberrypi.local", version: "0.14.2" };
const APP_VERSION = "0.15.0";

/* ---------- pieces ---------- */
function serverChip({ showVersion = true, switchable = true } = {}) {
  return `<div class="server">
    <div class="ico">${icon("server")}</div>
    <div class="who">
      <div class="name">${SERVER.name}<span class="tag">${SERVER.kind}</span></div>
      <div class="addr mono">${SERVER.addr}${showVersion ? ` · server ${SERVER.version}` : ""}</div>
    </div>
    ${switchable ? `<button class="btn ghost xs switch" title="Choose another connection">Switch</button>` : ""}
  </div>`;
}

function steps(list) {
  const dots = { done: icon("check"), active: icon("loader", "spin"), failed: icon("xCircle"), skipped: icon("minus"), pending: "" };
  return `<ol class="steps">${list.map(([state, label, sub, meta]) => `
    <li class="${state}" ${state === "active" ? 'aria-current="step"' : ""}>
      <span class="dot">${dots[state]}</span>
      <span class="step-label">${label}${sub ? `<span class="step-sub">${sub}</span>` : ""}</span>
      <span class="step-meta">${meta ?? ""}</span>
    </li>`).join("")}</ol>`;
}

function card({ tone, badge, spinning, title, text, body = "", actions = "", progress = false }) {
  return `<div class="conn">
    <section class="card tone-${tone}" aria-labelledby="ct">
      ${progress ? '<div class="bar" aria-hidden="true"></div>' : ""}
      <div class="card-body">
        ${serverChip()}
        <div class="head">
          <div class="badge">${icon(badge, spinning ? "spin" : "")}</div>
          <div><h2 id="ct">${title}</h2><p role="${tone === "error" ? "alert" : "status"}">${text}</p></div>
        </div>
        ${body}
        <div class="actions">${actions}</div>
      </div>
      <div class="panel-placeholder" hidden>ConnectionsPanel, in place of the status (SWE-247).</div>
      <div class="manage">${icon("settings")} Connections
        <button class="btn ghost xs" onclick="const c = this.closest('.conn'); c.querySelector('.panel-placeholder').hidden ^= 1; c.querySelector('.card-body').hidden ^= 1">Manage</button>
      </div>
    </section>
  </div>`;
}

function shell({ tone, banner = "", overlay = "", dimmed = false }) {
  return `<div class="shell tone-${tone}">
    ${banner}
    <div class="shell-main">
      <nav class="side">
        <div class="w on"><span class="av"></span>Research</div>
        <div class="w"><span class="av"></span>Inbox triage</div>
        <div class="w"><span class="av"></span>Release notes</div>
        <div class="conn-foot"><span class="led"></span>${SERVER.name}</div>
      </nav>
      <div class="chat ${dimmed ? "dimmed" : ""}">
        <div class="bubble out">Summarize what changed in the repo this week.</div>
        <div class="bubble">Working on it — reading the last 23 commits…</div>
        <div class="composer">Message Research…</div>
      </div>
    </div>
    ${overlay}
  </div>`;
}

function banner({ role = "status", ic, spin = false, title, meta, acts }) {
  return `<div class="banner" role="${role}">
    <span class="b-ico">${icon(ic, spin ? "spin" : "")}</span>
    <span class="b-title">${title}</span>
    <span class="b-meta">${meta}</span>
    <div class="acts">${acts}</div>
  </div>`;
}
function toast(title, sub) {
  return `<div class="toast" role="status">${icon("checkCircle")}<div class="t-text"><strong>${title}</strong><span>${sub}</span></div><button class="btn ghost xs" aria-label="Dismiss">${icon("x")}</button></div>`;
}

const B = (label, cls = "", ic = "") => `<button class="btn ${cls}">${ic ? icon(ic) : ""}${label}</button>`;
const useLocal = B("Use this computer instead", "ghost", "laptop");
const editConn = B("Edit connection", "outline", "settings");

/* ---------- states ---------- */
const STATES = {
  connecting: {
    label: "Connecting",
    variants: {
      progress: {
        label: "In progress",
        render: () => card({
          tone: "info", badge: "loader", spinning: true, progress: true,
          title: `Connecting to ${SERVER.name}`,
          text: "This usually takes a few seconds.",
          body: steps([
            ["done", "Reach the host", null, "0.3s"],
            ["done", "Sign in over SSH", "With key ~/.ssh/id_ed25519", "0.8s"],
            ["active", "Start the Wisp server", "Checking the version on the server", `<span data-tick>3s</span>`],
            ["pending", "Load your Wisps"],
          ]),
          actions: B("Cancel", "outline") + `<span class="spacer"></span>` + useLocal,
        }),
        notes: [
          "<b>Steps</b> replace the lone spinner, so a slow connection shows <i>where</i> it is waiting.",
          "<b>Server chip</b> at the top names the connection, its address and kind on every state.",
          "<b>Cancel</b> is new: it stops the attempt and leaves the card in the canceled state.",
          "The thin bar on top is the only motion besides the active step; it is hidden when nothing is running.",
        ],
      },
      waiting: {
        label: "Waiting for you",
        render: () => card({
          tone: "warn", badge: "key",
          title: `${SERVER.name} needs your answer`,
          text: "OpenSSH is asking to trust this host. Answer in the dialog to continue.",
          body: steps([
            ["done", "Reach the host", null, "0.3s"],
            ["active", "Sign in over SSH", "Waiting for you to confirm the host key", "paused"],
            ["pending", "Start the Wisp server"],
            ["pending", "Load your Wisps"],
          ]),
          actions: B("Cancel", "outline"),
        }),
        notes: [
          "When <code>sshPrompt</code> is set, the active step says it is waiting <b>on the person</b>, not on the network, and the timer stops.",
          "<code>SshPromptDialog</code> opens over the card, unchanged: closing it still declines.",
          "Amber tone = needs attention, not an error.",
        ],
      },
      connected: {
        label: "Connected",
        render: () => shell({
          tone: "ok",
          overlay: toast(`Connected to ${SERVER.name}`, `${SERVER.addr} · server ${SERVER.version}`),
        }),
        notes: [
          "Success goes straight to the app; a <b>toast</b> confirms which server is in use. Same place and look as the app update toast (<code>ToastFrame</code>, bottom right).",
          "The sidebar foot keeps a <b>status dot</b> with the server name, so the active connection is always visible.",
        ],
      },
    },
  },

  reconnecting: {
    label: "Reconnecting",
    variants: {
      retrying: {
        label: "Retrying",
        render: () => shell({
          tone: "warn",
          banner: banner({ ic: "loader", spin: true, title: `Reconnecting to ${SERVER.name}`, meta: `Attempt 3 · next in <span data-count="8">8s</span> · Wisps on it keep working`, acts: B("Retry now", "outline xs") + B("Details", "ghost xs") }),
        }),
        notes: [
          "Stays a <b>banner</b>: the app keeps its place in the tree and does not remount (no regression).",
          "Adds the <b>attempt count</b> and a <b>countdown</b> to the next retry, so it is clear Wisp is still trying.",
          "<b>Details</b> opens the same stepper as the card (see the next variant).",
          "Composer and history stay usable; sending queues until the connection is back.",
          "On mobile the first line holds the main message; attempt, countdown and actions go below. The icon sits on the left, centred on the two lines of text, above the row of actions.",
        ],
      },
      details: {
        label: "Details open",
        render: () => shell({
          tone: "warn",
          banner: banner({ ic: "loader", spin: true, title: `Reconnecting to ${SERVER.name}`, meta: `Attempt 3 · next in <span data-count="8">8s</span>`, acts: B("Retry now", "outline xs") + B("Details", "ghost xs") }),
          overlay: `<div class="pop tone-warn" role="dialog" aria-label="Connection details">
            ${serverChip({ switchable: false })}
            <h3>Lost the connection 42s ago</h3>
            <p>The SSH tunnel closed. Wisps on ${SERVER.name} keep running; you will see what they did when the app reconnects.</p>
            ${steps([
              ["failed", "Attempt 1", "Connection timed out", "0:05"],
              ["failed", "Attempt 2", "Connection timed out", "0:17"],
              ["active", "Attempt 3", "Next try in a few seconds"],
            ])}
            <div class="actions">${B("Retry now", "", "refresh")}${useLocal}</div>
          </div>`,
        }),
        notes: [
          "A popover on desktop, a <b>bottom sheet</b> on mobile (switch the viewport).",
          "Shows how long the connection has been down and the reason for each failed attempt.",
          "<b>Use this computer instead</b> moves here so the banner stays one short row.",
        ],
      },
      long: {
        label: "Down for a while",
        render: () => shell({
          tone: "error",
          dimmed: true,
          banner: banner({ role: "alert", ic: "wifiOff", title: `Unreachable for 5 min`, meta: `${SERVER.name} · still retrying every 30s`, acts: B("Retry now", "outline xs") + B("Edit connection", "ghost xs") + B("Details", "ghost xs") }),
        }),
        notes: [
          "After a threshold (e.g. 2 min), the banner turns <b>red</b>, says how long it has been down and slows the retries.",
          "The app content dims to signal it may be out of date, but stays readable.",
          "<b>Edit connection</b> appears here, since a changed address or key is now a likely cause.",
        ],
      },
    },
  },

  updating: {
    label: "Updating server",
    variants: {
      confirm: {
        label: "Confirm",
        render: () => card({
          tone: "info", badge: "arrowUp",
          title: `Update ${SERVER.name} to ${APP_VERSION}?`,
          text: `The server runs ${SERVER.version}, older than this app. Some features need both on the same version.`,
          body: `<div class="box">
            <h3>What happens</h3>
            <ul>
              <li>Wisp runs <code>npx wisp-server setup</code> on ${SERVER.name} over SSH.</li>
              <li><b>Kept:</b> Wisps, conversations and the master key in <code>~/.config/wisp</code>.</li>
              <li><b>Interrupted:</b> anything a Wisp is doing right now. <span style="color:var(--warning)">2 Wisps are running.</span></li>
            </ul>
          </div>`,
          actions: B("Update and reconnect", "", "arrowUp") + B("Not now", "outline"),
        }),
        notes: [
          "The confirmation leaves the cramped inline box in the banner and uses the <b>same card</b> as the other states.",
          "Lists what is <b>kept</b> and what is <b>interrupted</b> as separate lines, and counts running Wisps.",
          "Reached from the version banner's <b>Update server</b> button.",
        ],
      },
      progress: {
        label: "In progress",
        render: () => card({
          tone: "info", badge: "loader", spinning: true, progress: true,
          title: `Updating ${SERVER.name}`,
          text: `${SERVER.version} → ${APP_VERSION}. This can take a few minutes; keep this app open.`,
          body: steps([
            ["done", "Connect over SSH", null, "1s"],
            ["done", "Check Node.js and npm", "Node 22.19.0 · npm 10.9", "2s"],
            ["active", "Download wisp-server " + APP_VERSION, "18 of 31 MB", `<span data-tick>41s</span>`],
            ["pending", "Restart the service", "Running Wisps stop here"],
            ["pending", "Reconnect"],
          ]) + `<details class="log"><summary>${icon("chevron")}Setup output</summary><pre>$ npx wisp-server@${APP_VERSION} setup
Checking Node.js… 22.19.0 ok
Checking npm… 10.9.2 ok
Installing into ~/.local/lib/wisp-server
npm http fetch GET 200 https://registry.npmjs.org/wisp-server 412ms
added 214 packages in 38s …</pre></details>`,
          actions: B("Cancel update", "outline"),
        }),
        notes: [
          "Shows <b>from → to</b> versions and real steps of <code>wisp-server setup</code>.",
          "Says <b>which step interrupts</b> running Wisps, so cancelling before it is safe.",
          "<b>Setup output</b> is collapsed by default; useful when reporting a problem.",
          "Depends on the server streaming step events (SWE-111); until then the steps can be coarse.",
        ],
      },
      canceled: {
        label: "Canceled",
        render: () => card({
          tone: "neutral", badge: "ban",
          title: "Update canceled",
          text: `${SERVER.name} still runs ${SERVER.version}. Nothing was changed on the server.`,
          body: steps([
            ["done", "Connect over SSH"],
            ["done", "Check Node.js and npm"],
            ["skipped", "Download wisp-server " + APP_VERSION, "Canceled by you"],
            ["skipped", "Restart the service"],
            ["skipped", "Reconnect"],
          ]),
          actions: B(`Continue with ${SERVER.version}`) + B("Update again", "outline", "refresh"),
        }),
        notes: [
          "Canceling is <b>neutral grey</b>, never red: it is the person's choice, not a failure.",
          "Says plainly that the server was <b>not changed</b>, and offers to continue on the old version.",
        ],
      },
      done: {
        label: "Done",
        render: () => shell({
          tone: "ok",
          overlay: toast(`${SERVER.name} updated to ${APP_VERSION}`, `Previously ${SERVER.version}.`),
        }),
        notes: [
          "Success returns to the app with a toast; the version-mismatch banner disappears on its own.",
        ],
      },
    },
  },

  failure: {
    label: "Failure",
    variants: {
      auth: {
        label: "SSH sign-in",
        render: () => card({
          tone: "error", badge: "key",
          title: `Could not sign in to ${SERVER.name}`,
          text: "The server did not accept any of this computer's SSH keys.",
          body: steps([
            ["done", "Reach the host"],
            ["failed", "Sign in over SSH", "Permission denied (publickey)"],
            ["pending", "Start the Wisp server"],
            ["pending", "Load your Wisps"],
          ]) + `<div class="box error">
            <h3>How to fix it</h3>
            <ol>
              <li>Add this computer's key to the server, from a terminal here:
                <div class="cmd"><code>ssh-copy-id ${SERVER.addr}</code><button class="btn ghost xs" aria-label="Copy">${icon("copy")}</button></div>
              </li>
              <li>Or check that the user in the connection is right (<code>pi</code>).</li>
            </ol>
          </div>
          <details class="log"><summary>${icon("chevron")}Technical details</summary><pre>ssh -o BatchMode=yes pi@raspberrypi.local
debug1: Offering public key: ~/.ssh/id_ed25519 ED25519 SHA256:k3Xb…
debug1: Authentications that can continue: publickey
pi@raspberrypi.local: Permission denied (publickey).</pre></details>`,
          actions: B("Try again", "", "refresh") + editConn + `<span class="spacer"></span>` + useLocal,
        }),
        notes: [
          "The <b>failed step</b> is marked in the stepper, so it is clear the host was reached but sign-in failed.",
          "Guidance is <b>specific to the error</b> (SWE-109), with a copyable command.",
          "Raw OpenSSH output moves to <b>Technical details</b>, collapsed.",
          "Actions in order: <b>Try again</b> (primary), <b>Edit connection</b>, then the way out.",
        ],
      },
      unreachable: {
        label: "Unreachable",
        render: () => card({
          tone: "error", badge: "wifiOff",
          title: `Cannot reach ${SERVER.name}`,
          text: "raspberrypi.local did not answer. It may be off, asleep, or on another network.",
          body: steps([
            ["failed", "Reach the host", "No answer after 10s"],
            ["pending", "Sign in over SSH"],
            ["pending", "Start the Wisp server"],
            ["pending", "Load your Wisps"],
          ]) + `<div class="box error">
            <h3>Things to check</h3>
            <ul>
              <li>The machine is on and connected to the network.</li>
              <li>This computer is on the same network or VPN (e.g. Tailscale).</li>
              <li><code>.local</code> names need mDNS; try the IP address instead.</li>
            </ul>
          </div>`,
          actions: B("Try again", "", "refresh") + editConn + `<span class="spacer"></span>` + useLocal,
        }),
        notes: [
          "Same layout as the sign-in failure, different icon, step and checklist.",
          "Each error class (network, sign-in, server not installed, version) gets its own short checklist.",
        ],
      },
      notInstalled: {
        label: "Not installed",
        render: () => card({
          tone: "error", badge: "server",
          title: `Wisp is not installed on ${SERVER.name}`,
          text: "Signed in over SSH, but the Wisp server was not found.",
          body: steps([
            ["done", "Reach the host"],
            ["done", "Sign in over SSH"],
            ["failed", "Start the Wisp server", "~/.local/lib/wisp-server is missing"],
            ["pending", "Load your Wisps"],
          ]) + `<div class="box">
            <h3>${icon("info")} Wisp can set it up for you</h3>
            <p>Installs the server in <code>~/.local/lib/wisp-server</code>, creates a master key in <code>~/.config/wisp</code> and starts a systemd user service. Needs Node.js 22.19+ and internet access on the server.</p>
          </div>`,
          actions: B(`Install on ${SERVER.name}`, "", "arrowUp") + editConn + `<span class="spacer"></span>` + useLocal,
        }),
        notes: [
          "The install offer appears only when the failure is <b>“server missing”</b>, not after every error as today.",
          "Install then follows the same stepper as <i>Updating server → In progress</i>.",
        ],
      },
      updateFailed: {
        label: "Update failed",
        render: () => card({
          tone: "error", badge: "xCircle",
          title: `Could not update ${SERVER.name}`,
          text: `The server still runs ${SERVER.version} and was restarted, so your Wisps are back.`,
          body: steps([
            ["done", "Connect over SSH"],
            ["failed", "Check Node.js and npm", "Node.js 20.11 found; 22.19 or later is needed"],
            ["skipped", "Download wisp-server " + APP_VERSION],
            ["skipped", "Restart the service"],
            ["skipped", "Reconnect"],
          ]) + `<div class="box error">
            <h3>How to fix it</h3>
            <p>Update Node.js on ${SERVER.name} (for example with <code>nvm install 22</code>), make sure non-interactive SSH sessions see it, then try again.</p>
          </div>
          <details class="log"><summary>${icon("chevron")}Setup output</summary><pre>$ npx wisp-server@${APP_VERSION} setup
Checking Node.js… 20.11.1
error: wisp-server needs Node.js 22.19 or later</pre></details>`,
          actions: B("Try again", "", "refresh") + B(`Continue with ${SERVER.version}`, "outline"),
        }),
        notes: [
          "Says what state the server is left in <b>first</b>: still on the old version and running.",
          "Later steps show as <b>skipped</b>, not pending, so it is clear they will not run.",
        ],
      },
    },
  },
};

/* ---------- explorer ---------- */
const ui = { state: "connecting", variant: "progress", theme: "light", vp: "desktop" };
try { Object.assign(ui, JSON.parse(localStorage.getItem("conn-flow") || "{}")); } catch {}
// ?s=failure&v=auth&t=dark&vp=mobile opens a specific screen.
const q = new URLSearchParams(location.search);
for (const [param, key] of [["s", "state"], ["v", "variant"], ["t", "theme"], ["vp", "vp"]]) if (q.get(param)) ui[key] = q.get(param);

function seg(el, items, current, onPick) {
  el.innerHTML = items.map(([v, label]) => `<button data-v="${v}" aria-pressed="${v === current}">${label}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (b) onPick(b.dataset.v); };
}

let timers = [];
function render() {
  const state = STATES[ui.state] ?? STATES.connecting;
  if (!state.variants[ui.variant]) ui.variant = Object.keys(state.variants)[0];
  const variant = state.variants[ui.variant];
  try { localStorage.setItem("conn-flow", JSON.stringify(ui)); } catch {}

  seg(document.getElementById("states"), Object.entries(STATES).map(([k, s]) => [k, s.label]), ui.state, (v) => { ui.state = v; ui.variant = ""; render(); });
  seg(document.getElementById("variants"), Object.entries(state.variants).map(([k, s]) => [k, s.label]), ui.variant, (v) => { ui.variant = v; render(); });
  seg(document.getElementById("theme"), [["light", "Light"], ["dark", "Dark"]], ui.theme, (v) => { ui.theme = v; render(); });
  seg(document.getElementById("vp"), [["desktop", "Desktop"], ["mobile", "Mobile"]], ui.vp, (v) => { ui.vp = v; render(); });

  const app = document.getElementById("app");
  app.className = "app" + (ui.theme === "dark" ? " dark" : "");
  document.getElementById("frame").className = "frame" + (ui.vp === "mobile" ? " mobile" : "");
  const out = variant.render();
  app.innerHTML = `<div class="titlebar"><i></i><i></i><i></i></div>` + (out.startsWith('<div class="conn"') ? `<div class="screen">${out}</div>` : out);

  document.getElementById("notes").innerHTML = `<h2>${state.label} · ${variant.label}</h2><ul>${variant.notes.map((n) => `<li>${n}</li>`).join("")}</ul>
    <hr><h2>Across all states</h2><ul>
      <li>One card, one stepper, one server chip: states differ by <b>tone</b> (blue working, amber needs you, red failed, grey canceled, green done).</li>
      <li>Blocking states use the card; <b>reconnecting</b> keeps the app and uses a banner.</li>
      <li>The connections panel and <b>Edit connection</b> open <b>in the card</b>, in place of the status, behind “Connections › Manage”; <b>Back</b> or <b>Hide</b> returns to it (SWE-247).</li>
      <li>On mobile the actions stack full width and popovers become bottom sheets.</li>
    </ul>`;

  timers.forEach(clearInterval); timers = [];
  app.querySelectorAll("[data-tick]").forEach((el) => {
    let s = parseInt(el.textContent, 10);
    timers.push(setInterval(() => { el.textContent = ++s + "s"; }, 1000));
  });
  app.querySelectorAll("[data-count]").forEach((el) => {
    let s = Number(el.dataset.count);
    timers.push(setInterval(() => { s = s <= 1 ? Number(el.dataset.count) : s - 1; el.textContent = s + "s"; }, 1000));
  });
}
render();
</script>
</body>
</html>
